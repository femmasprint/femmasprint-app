<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Femmas Print — Live device preview</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#070b14;color:#e8eef7}
  body{display:flex;flex-direction:column}
  .bar{display:flex;gap:8px;align-items:center;padding:10px 14px;background:#13315a;flex:none;flex-wrap:wrap}
  .bar b{font-size:14px;margin-right:6px}
  .btn{font-size:13px;padding:7px 14px;border-radius:9px;border:1px solid #2a4straße;border:1px solid #2a4b78;background:#0f2038;color:#cbd8ea;cursor:pointer}
  .btn.on{background:#2e90f0;border-color:#2e90f0;color:#fff}
  .dim{margin-left:auto;font-size:12px;color:#8aa0c0}
  .stage{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:18px;background:#070b14}
  .frame{background:#000;border:10px solid #05070d;border-radius:24px;overflow:hidden;flex:none;box-shadow:0 10px 44px rgba(0,0,0,.55)}
  iframe{border:0;display:block;background:#0a0e1a}
</style>
</head>
<body>
  <div class="bar">
    <b>Femmas Print — Live</b>
    <button class="btn on" data-w="390" data-h="800">Simu</button>
    <button class="btn" data-w="800" data-h="1024">Tablet</button>
    <button class="btn" data-w="1280" data-h="820">Desktop</button>
    <button class="btn" id="reload">&#8635; Refresh</button>
    <span class="dim" id="dim"></span>
  </div>
  <div class="stage">
    <div class="frame" id="frame"><iframe id="app" src="/" title="Femmas Print app"></iframe></div>
  </div>
<script>
  var app=document.getElementById('app'), dim=document.getElementById('dim');
  var btns=[].slice.call(document.querySelectorAll('.btn[data-w]'));
  function set(w,h){ app.style.width=w+'px'; app.style.height=h+'px'; dim.textContent=w+' × '+h+' px'; }
  btns.forEach(function(b){ b.addEventListener('click', function(){
    btns.forEach(function(x){x.classList.remove('on');}); b.classList.add('on');
    set(parseInt(b.dataset.w,10), parseInt(b.dataset.h,10));
  }); });
  document.getElementById('reload').addEventListener('click', function(){ app.src = app.src; });
  set(390, 800);
</script>
</body>
</html>
