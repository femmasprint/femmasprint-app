/* FEMMAS network timeout guard: never let one stalled API keep the whole dashboard loading. */
(function () {
  const nativeFetch = window.fetch.bind(window);
  window.fetch = function(input, init) {
    init = init || {};
    let url = '';
    try { url = typeof input === 'string' ? input : (input && input.url) || ''; } catch (_) {}
    const method = String(init.method || (input && input.method) || 'GET').toUpperCase();
    const isData = /(?:base44\.app|\/api\/)/i.test(url);
    if (!isData || init.signal) return nativeFetch(input, init);

    const controller = new AbortController();
    const ms = method === 'GET' || method === 'HEAD' ? 6000 : 10000;
    const timer = setTimeout(function () { try { controller.abort(); } catch (_) {} }, ms);
    return nativeFetch(input, Object.assign({}, init, { signal: controller.signal }))
      .finally(function () { clearTimeout(timer); });
  };
})();

/* FEMMAS XHR timeout guard: Base44 SDK/Axios uses XHR, so stalled entity calls
   must fail fast instead of keeping the dashboard loader alive for minutes. */
(function () {
  var NativeXHR = window.XMLHttpRequest;
  if (!NativeXHR || NativeXHR.__femmasGuarded) return;

  var nativeOpen = NativeXHR.prototype.open;
  var nativeSend = NativeXHR.prototype.send;

  NativeXHR.prototype.open = function(method, url) {
    this.__fpMethod = String(method || 'GET').toUpperCase();
    this.__fpUrl = String(url || '');
    return nativeOpen.apply(this, arguments);
  };

  NativeXHR.prototype.send = function() {
    try {
      if (!this.timeout) {
        var isApi = /base44\.app|\/api\//i.test(this.__fpUrl || '');
        if (isApi) this.timeout = (this.__fpMethod === 'GET' || this.__fpMethod === 'HEAD') ? 6500 : 12000;
      }
    } catch (_) {}
    return nativeSend.apply(this, arguments);
  };

  NativeXHR.__femmasGuarded = true;
})();

    <script type="module">
if (window.self === window.top) {
  let lastPath = "";
  function getPageNameFromPath(path) {
    const segments = path.split("/").filter(Boolean);
    return segments[0] || null;
  }
  function trackPageView() {
    const path = window.location.pathname;
    if (path === lastPath) return;
    lastPath = path;
    const pageName = getPageNameFromPath(path) || "home";
    const appId = "";
    if (!appId) return;
    fetch(`/api/app-logs/${appId}/log-user-in-app/${pageName}`, {
      method: "POST",
    }).catch(() => {});
  }
  const originalPushState = history.pushState.bind(history);
  history.pushState = function (...args) {
    originalPushState(...args);
    trackPageView();
  };
  const originalReplaceState = history.replaceState.bind(history);
  history.replaceState = function (...args) {
    originalReplaceState(...args);
    trackPageView();
  };
  window.addEventListener("popstate", trackPageView);
  trackPageView();
}
