name: Check Browser Data Bridge Policy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          echo "--- live data endpoint ---"
          curl -sS --max-time 30 "https://app.femmasprint.com/api/femmas-shared-sheet?sheet=QuickSale&date=2026-09-21" -o /tmp/live.json
          python -c "import json; d=json.load(open('/tmp/live.json')); rows=d.get('rows') or []; print('ok',d.get('ok'),'source',d.get('source'),'rows',len(rows)); print('last',[(x.get('Client'),x.get('Goods'),x.get('Amount')) for x in rows[-3:]]); raise SystemExit(0 if d.get('ok') and len(rows)>=10 else 1)"

          echo "--- wait for deployed Base44 bundle with same-origin bridge ---"
          found=0
          for i in $(seq 1 30); do
            curl -sSL --max-time 20 https://app.femmasprint.com/ -o /tmp/app.html
            asset=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' /tmp/app.html | head -1 || true)
            echo "attempt=$i asset=$asset"
            if [ -n "$asset" ]; then
              curl -sSL --max-time 30 "https://app.femmasprint.com$asset" -o /tmp/app.js
              if grep -q "/api/femmas-shared-sheet" /tmp/app.js; then
                echo "bundle_bridge=yes asset=$asset"
                found=1
                break
              fi
            fi
            sleep 10
          done
          test "$found" = "1"
