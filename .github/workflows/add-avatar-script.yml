name: Wire avatar script

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-avatar-script.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject avatar script
        shell: python
        run: |
          from pathlib import Path
          p = Path('functions/_middleware.js')
          s = p.read_text(encoding='utf-8')
          old = "          el.append('<script id=\"fpTheme\" src=\"/fp-theme.js\" defer></scr' + 'ipt>', { html: true });\n"
          new = old + "          el.append('<script id=\"fpAvatars\" src=\"/fp-avatars.js\" defer></scr' + 'ipt>', { html: true });\n"
          if 'id=\"fpAvatars\"' not in s:
              if old not in s:
                  raise SystemExit('fpTheme injection line not found')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          rm .github/workflows/add-avatar-script.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/_middleware.js .github/workflows/add-avatar-script.yml
          git commit -m "load expense avatar enhancer"
          git push
