name: One-time language switch repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-language-switch.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore fp-theme loader
        shell: python
        run: |
          from pathlib import Path

          path = Path("functions/_middleware.js")
          text = path.read_text(encoding="utf-8")
          needle = "          el.append('<script id=\"fpInvSkin\" src=\"/fp-invoice-skin.js\" defer></scr' + 'ipt>', { html: true });"
          loader = "          el.append('<script id=\"fpTheme\" src=\"/fp-theme.js\" defer></scr' + 'ipt>', { html: true });"

          if 'id="fpTheme"' not in text:
              if needle not in text:
                  raise SystemExit("Expected fpInvSkin injection point not found")
              text = text.replace(needle, loader + "\n" + needle, 1)
              path.write_text(text, encoding="utf-8")

      - name: Remove one-time workflow
        run: rm .github/workflows/fix-language-switch.yml

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/_middleware.js .github/workflows/fix-language-switch.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "restore language switch loader"
          git push
