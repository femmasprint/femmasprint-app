name: Diagnose Live Bundle
on:
  push:
    branches: [diagnostic-live-bundle-20260921]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          echo "--- root headers ---"
          curl -sSIL --max-time 30 https://app.femmasprint.com/ | sed -n '1,35p'
          echo "--- root asset ---"
          curl -sSL --max-time 30 https://app.femmasprint.com/ -o /tmp/app.html
          asset=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' /tmp/app.html | head -1)
          echo "asset=$asset"
          curl -sSL --max-time 40 "https://app.femmasprint.com$asset" -o /tmp/app.js
          python - <<'PY'
          from pathlib import Path
          c=Path('/tmp/app.js').read_text(errors='ignore')
          checks={
            'shared_endpoint':'/api/femmas-shared-sheet' in c,
            'employee_mapper':'sheet-employee-' in c,
            'parallel_employee_error':'Wafanyakazi hawakuweza kupakiwa kutoka Base44 wala FEMMAS database' in c,
            'session_cache':'femmas_shared_cache:' in c,
            'read_legacy_employees':'readLegacyEmployees' in c,
          }
          print('bundle_bytes',len(c))
          print('checks',checks)
          PY
          echo "--- Employees endpoint x2 ---"
          curl -sS --max-time 30 -w "first_http=%{http_code} first_time=%{time_total}s\n" "https://app.femmasprint.com/api/femmas-shared-sheet?sheet=Employees" -o /tmp/e1.json
          curl -sS --max-time 30 -w "second_http=%{http_code} second_time=%{time_total}s\n" "https://app.femmasprint.com/api/femmas-shared-sheet?sheet=Employees" -o /tmp/e2.json
          python - <<'PY'
          import json
          for f in ['/tmp/e1.json','/tmp/e2.json']:
              d=json.load(open(f))
              print(f, 'ok=',d.get('ok'),'source=',d.get('source'),'rows=',len(d.get('rows') or []))
          PY
