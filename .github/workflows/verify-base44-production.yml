name: Verify Base44 Production Switch

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare and verify upstream
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 24); do
            echo "Attempt $i"
            curl -sS -D /tmp/app.h -o /tmp/app.html --max-time 20 https://app.femmasprint.com/ || true
            if grep -qi '^x-femmas-app-source: femmasbase' /tmp/app.h 2>/dev/null; then
              ok=1
              break
            fi
            sleep 5
          done
          echo "--- app headers ---"
          sed -n '1,30p' /tmp/app.h || true
          test "$ok" = "1"

          curl -sSL --max-time 20 https://femmasbase.pages.dev/ -o /tmp/base.html
          python - <<'PY'
          import hashlib, pathlib
          app=pathlib.Path('/tmp/app.html').read_bytes()
          base=pathlib.Path('/tmp/base.html').read_bytes()
          print('app_bytes',len(app))
          print('base_bytes',len(base))
          print('app_sha256',hashlib.sha256(app).hexdigest())
          print('base_sha256',hashlib.sha256(base).hexdigest())
          print('html_equal',app==base)
          if app != base:
              raise SystemExit('Production HTML does not match femmasbase upstream')
          PY

          curl -sS -o /dev/null -w 'login_status=%{http_code}\n' --max-time 20 https://app.femmasprint.com/login
          curl -sS -o /dev/null -w 'dashboard_status=%{http_code}\n' --max-time 20 https://app.femmasprint.com/dashboard

          python - <<'PY'
          import re, pathlib, subprocess, hashlib
          html=pathlib.Path('/tmp/app.html').read_text(errors='replace')
          refs=re.findall(r'''(?:src|href)=["']([^"']+\.(?:js|css))["']''',html)
          local=[x for x in refs if x.startswith('/')]
          print('asset_refs',local[:5])
          if not local:
              raise SystemExit('No local JS/CSS asset found')
          asset=local[0]
          subprocess.run(['curl','-sSL','--max-time','20','https://app.femmasprint.com'+asset,'-o','/tmp/app.asset'],check=True)
          subprocess.run(['curl','-sSL','--max-time','20','https://femmasbase.pages.dev'+asset,'-o','/tmp/base.asset'],check=True)
          a=pathlib.Path('/tmp/app.asset').read_bytes()
          b=pathlib.Path('/tmp/base.asset').read_bytes()
          print('asset',asset,'bytes',len(a),'equal',a==b)
          print('asset_sha256',hashlib.sha256(a).hexdigest())
          if a!=b:
              raise SystemExit('Asset mismatch')
          PY

          app_api=$(curl -sS -o /tmp/app-api.json -w '%{http_code}' --max-time 20 -H 'content-type: application/json' -d '{"email":"probe@example.invalid","password":"not-a-real-password"}' https://app.femmasprint.com/api/auth/login || true)
          base_api=$(curl -sS -o /tmp/base-api.json -w '%{http_code}' --max-time 20 -H 'content-type: application/json' -d '{"email":"probe@example.invalid","password":"not-a-real-password"}' https://femmasbase.pages.dev/api/auth/login || true)
          echo "app_api_status=$app_api base_api_status=$base_api"
          test "$app_api" = "$base_api"
          cmp /tmp/app-api.json /tmp/base-api.json

          echo "--- shared data bridge ---"
          curl -sSIL --max-time 20 "https://docs.google.com/spreadsheets/d/15fuAWl1c6kD70sIxK-yIP15K3OVr97JHXA9KFDfrPec/export?format=csv&sheet=QuickSale" | sed -n '1,25p'
          curl -sSL --max-time 20 "https://script.google.com/macros/s/AKfycbzgr7hqI4vPFHB9nNRh2l7Ljb7m0KCf9Yl1Ue4pEfgSAADE4-luyv0B3_tn0zo0bQzecg/exec?action=getQuickSale&date=2026-09-21&callback=probeCb" -o /tmp/bridge.txt
          echo "bridge_bytes=$(wc -c < /tmp/bridge.txt)"
          head -c 500 /tmp/bridge.txt | tr '\n' ' '
          echo

          echo "--- same-origin live QuickSale ---"
          ok=0
          for i in $(seq 1 24); do
            code=$(curl -sS -o /tmp/live.json -w '%{http_code}' --max-time 20 "https://app.femmasprint.com/api/femmas-shared-sheet?sheet=QuickSale&date=2026-09-21" || true)
            echo "attempt=$i status=$code"
            if [ "$code" = "200" ]; then
              python - <<'PY'
import json
data=json.load(open('/tmp/live.json'))
rows=data.get('rows') or []
print('live_quicksale_rows',len(rows))
if len(rows) < 10:
    raise SystemExit(1)
PY
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
