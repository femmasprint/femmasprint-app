name: Fix Quick Sale payment dropdown overlay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-quick-sale-payment-dropdown-overlay.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep Quick Sale payment menus above rows
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text()
          old = 'position:absolute;left:3px;right:3px;top:100%;margin-top:3px;z-index:60;'
          new = 'position:absolute;left:3px;right:3px;bottom:100%;margin-bottom:3px;z-index:9999;'
          count = html.count(old)
          if count:
              html = html.replace(old, new)
              index.write_text(html)
              print(f'Changed {count} native payment dropdown(s) to open upward')
          elif new in html:
              print('Native payment dropdowns already open upward')
          else:
              raise SystemExit('Payment dropdown style anchor not found in index.html')

          side = Path('fp-sidebar.js')
          js = side.read_text()
          old_listener = "    }, false);\n\n    document.addEventListener('keydown', function (e) {"
          new_listener = "    }, true);\n\n    document.addEventListener('keydown', function (e) {"
          if old_listener in js:
              js = js.replace(old_listener, new_listener, 1)
              print('Changed payment portal listener to capture phase')
          elif new_listener in js:
              print('Payment portal listener already uses capture phase')
          else:
              print('Payment portal listener anchor not found; continuing because native dropdown is already fixed')

          marker = 'FEMMAS PRINT — Quick Sale desktop table fit v1'
          if marker not in js:
              js += r'''

/* FEMMAS PRINT — Quick Sale desktop table fit v1.
 * Fits the 10-column Sales table inside the available desktop workspace, removes the
 * unnecessary horizontal scrollbar on desktop, and keeps the blank entry row clean. */
(function () {
  try {
    var style = document.createElement('style');
    style.id = 'fpQuickSaleTableFitV1';
    style.textContent =
      '@media (min-width:1100px){' +
      '[data-screen-label="Quick Sale"] .fp-qs-sales-wrap{overflow-x:visible!important;max-width:100%!important}' +
      '[data-screen-label="Quick Sale"] table.fp-qs-sales-fit{width:100%!important;min-width:0!important;max-width:100%!important;table-layout:fixed!important}' +
      '[data-screen-label="Quick Sale"] table.fp-qs-sales-fit th,[data-screen-label="Quick Sale"] table.fp-qs-sales-fit td{min-width:0!important;box-sizing:border-box!important;overflow:visible}' +
      '[data-screen-label="Quick Sale"] table.fp-qs-sales-fit input{width:100%!important;min-width:0!important;box-sizing:border-box!important}' +
      '[data-screen-label="Quick Sale"] table.fp-qs-sales-fit th:nth-child(1),[data-screen-label="Quick Sale"] table.fp-qs-sales-fit td:nth-child(1){width:4%!important}' +
      '[data-screen-label="Quick Sale"] table.fp-qs-sales-fit th:nth-child(2),[data-screen-label="Quick Sale"] table.fp-qs-sales-fit td:nth-child(2){width:14%!important}' +
      '[data-screen-label="Quick Sale"] table.fp-qs-sales-fit th:nth-child(3),[data-screen-label="Quick Sale"] table.fp-qs-sales-fit td:nth-child(3){width:18%!important}' +
      '[data-screen-label="Quick Sale"] table.fp-qs-sales-fit th:nth-child(4),[data-screen-label="Quick Sale"] table.fp-qs-sales-fit td:nth-child(4){width:7%!important}' +
      '[data-screen-label="Quick Sale"] table.fp-qs-sales-fit th:nth-child(5),[data-screen-label="Quick Sale"] table.fp-qs-sales-fit td:nth-child(5){width:10%!important}' +
      '[data-screen-label="Quick Sale"] table.fp-qs-sales-fit th:nth-child(6),[data-screen-label="Quick Sale"] table.fp-qs-sales-fit td:nth-child(6){width:12%!important}' +
      '[data-screen-label="Quick Sale"] table.fp-qs-sales-fit th:nth-child(7),[data-screen-label="Quick Sale"] table.fp-qs-sales-fit td:nth-child(7){width:13%!important}' +
      '[data-screen-label="Quick Sale"] table.fp-qs-sales-fit th:nth-child(8),[data-screen-label="Quick Sale"] table.fp-qs-sales-fit td:nth-child(8){width:10%!important}' +
      '[data-screen-label="Quick Sale"] table.fp-qs-sales-fit th:nth-child(9),[data-screen-label="Quick Sale"] table.fp-qs-sales-fit td:nth-child(9){width:9%!important}' +
      '[data-screen-label="Quick Sale"] table.fp-qs-sales-fit th:nth-child(10),[data-screen-label="Quick Sale"] table.fp-qs-sales-fit td:nth-child(10){width:3%!important}' +
      '[data-screen-label="Quick Sale"] table.fp-qs-sales-fit td:nth-child(7)>div:first-child{padding-left:7px!important;padding-right:7px!important}' +
      '}' +
      '[data-screen-label="Quick Sale"] tr.fp-qs-empty-row td:nth-child(7)>div:first-child{visibility:hidden!important}';
    document.head.appendChild(style);

    function applyFit() {
      var root = document.querySelector('[data-screen-label="Quick Sale"]');
      if (!root) return;
      var tables = root.querySelectorAll('table');
      for (var i = 0; i < tables.length; i++) {
        var table = tables[i];
        var row = table.querySelector('tbody tr');
        if (!row || !row.children || row.children.length !== 10) continue;
        table.classList.add('fp-qs-sales-fit');
        if (table.parentElement) table.parentElement.classList.add('fp-qs-sales-wrap');
        var rows = table.querySelectorAll('tbody tr');
        for (var j = 0; j < rows.length; j++) {
          var client = rows[j].querySelector('input[data-qs-client]');
          if (!client) continue;
          rows[j].classList.toggle('fp-qs-empty-row', !String(client.value || '').trim());
        }
      }
    }

    function boot() {
      applyFit();
      document.addEventListener('input', function (e) {
        if (e.target && e.target.matches && e.target.matches('[data-screen-label="Quick Sale"] input[data-qs-client]')) applyFit();
      }, true);
      if (window.MutationObserver && document.body) {
        var pending = false;
        new MutationObserver(function () {
          if (pending) return;
          pending = true;
          setTimeout(function () { pending = false; applyFit(); }, 40);
        }).observe(document.body, { childList:true, subtree:true });
      }
      window.addEventListener('resize', applyFit);
      setInterval(applyFit, 2000);
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  } catch (e) {}
})();
'''
              print('Appended Quick Sale desktop table fit')
          else:
              print('Quick Sale desktop table fit already present')

          side.write_text(js)
          PY

      - name: Commit fix
        run: |
          if git diff --quiet -- index.html fp-sidebar.js; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html fp-sidebar.js
          git commit -m "fit Quick Sale sales table on desktop"
          git push
