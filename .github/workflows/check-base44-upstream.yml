name: Check Base44 Upstream

on:
  push:
    branches: [base44-full-migration-staging]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify shared-data bridge reached production
        shell: bash
        run: |
          set -euo pipefail
          marker='Apps Script bridge unavailable'
          check_site () {
            base="$1"
            out="$2"
            for i in $(seq 1 36); do
              echo "$base attempt $i"
              curl -sSL --max-time 20 "$base/" -o "/tmp/$out.html" || true
              asset=$(grep -oE '/assets/index-[^"]+\.js' "/tmp/$out.html" | head -n1 || true)
              if [ -n "$asset" ]; then
                curl -sSL --max-time 30 "$base$asset" -o "/tmp/$out.js" || true
                if grep -Fq "$marker" "/tmp/$out.js"; then
                  echo "marker found: $base$asset"
                  return 0
                fi
              fi
              sleep 5
            done
            return 1
          }
          check_site https://femmasbase.pages.dev base
          check_site https://app.femmasprint.com app
