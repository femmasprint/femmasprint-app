name: Check Base44 Upstream

on:
  push:
    branches: [base44-full-migration-staging]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe shared office sheet visibility
        shell: bash
        run: |
          set -euo pipefail
          url='https://docs.google.com/spreadsheets/d/15fuAWl1c6kD70sIxK-yIP15K3OVr97JHXA9KFDfrPec/export?format=csv&sheet=QuickSale'
          code=$(curl -sSL -o /tmp/qs.csv -w '%{http_code}' --max-time 30 "$url" || true)
          echo "sheet_status=$code"
          echo "sheet_bytes=$(wc -c </tmp/qs.csv 2>/dev/null || echo 0)"
          head -c 180 /tmp/qs.csv 2>/dev/null | tr '\n' ' ' || true
          echo
          if grep -q '2026-09-21' /tmp/qs.csv 2>/dev/null; then
            echo 'today_rows_visible=true'
          else
            echo 'today_rows_visible=false'
          fi
