name: Check Base44 Upstream

on:
  push:
    branches: [base44-full-migration-staging]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe legacy QuickSale daily endpoint
        shell: bash
        run: |
          set -euo pipefail
          base='https://script.google.com/macros/s/AKfycbzgr7hqI4vPFHB9nNRh2l7Ljb7m0KCf9Yl1Ue4pEfgSAADE4-luyv0B3_tn0zo0bQzecg/exec'
          code=$(curl -sSL --retry 2 --retry-delay 2 --max-time 35 -o /tmp/day.js -w '%{http_code}' "$base?action=getQuickSale&date=2026-09-21&callback=probeCb" || true)
          echo "status=$code bytes=$(wc -c </tmp/day.js 2>/dev/null || echo 0)"
          head -c 240 /tmp/day.js 2>/dev/null | tr '\n' ' ' || true
          echo
          grep -q '2026-09-21\|SALE-20260921' /tmp/day.js
