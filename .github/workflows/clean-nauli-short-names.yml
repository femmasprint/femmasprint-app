name: Fix Quick Sale worker duplicates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-nauli-short-names.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deduplicate canonical Nauli rows in app state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          canonical = "{ 'ismail issa':1, 'hassan mwesiumo':1, 'ismar salim hussein (suma)':1, 'steven mkope':1, 'fadhili ally':1, 'emanuel w. sese (ima)':1, 'sedekia johnson laurent':1, 'henry charles kwedi':1, 'shaibu frank malekela':1 }"

          # 1) Cloud pull: keep only one canonical Nauli row per worker, regardless of ExpenseID/time.
          if '_canonicalNauliCloudDedupe' not in s:
              anchor = "          le.forEach(rw => { if (rw._eid) expDone[rw._eid] = rw.client + '|' + rw.goods + '|' + rw.qty + '|' + rw.price + '|' + (rw.payMode || 'Cash'); });"
              if anchor not in s:
                  raise SystemExit('cloud dedupe anchor not found')
              block = "\n".join([
                  "          const _canonicalNauliCloudDedupe = " + canonical + ";",
                  "          const _seenCanonicalNauliCloud = {};",
                  "          le = le.filter(function (rw) {",
                  "            const nm = String((rw && rw.client) || '').trim().toLowerCase();",
                  "            const rs = String((rw && rw.goods) || '').trim().toLowerCase();",
                  "            if (_canonicalNauliCloudDedupe[nm] && rs.indexOf('nauli') > -1) {",
                  "              if (_seenCanonicalNauliCloud[nm]) return false;",
                  "              _seenCanonicalNauliCloud[nm] = 1;",
                  "            }",
                  "            return true;",
                  "          });",
                  anchor,
              ])
              s = s.replace(anchor, block, 1)

          # 2) Local cache restore: also dedupe canonical Nauli rows before they enter React state.
          if '_canonicalNauliCacheDedupe' not in s:
              pattern = re.compile(r"(              patch\.qsExpenses = \(Array\.isArray\(c\.qsExpenses\) \? c\.qsExpenses : \[\]\)\.filter\(function \(rw\) \{\n                const nm = String\(\(rw && rw\.client\) \|\| ''\)\.trim\(\)\.toLowerCase\(\);\n                const rs = String\(\(rw && rw\.goods\) \|\| ''\)\.trim\(\)\.toLowerCase\(\);\n                return !\(_legacyNauliCache\[nm\] && rs\.indexOf\('nauli'\) > -1\);\n              \}\);)")
              m = pattern.search(s)
              if not m:
                  raise SystemExit('cache restore block not found')
              extra = "\n" + "\n".join([
                  "              const _canonicalNauliCacheDedupe = " + canonical + ";",
                  "              const _seenCanonicalNauliCache = {};",
                  "              patch.qsExpenses = patch.qsExpenses.filter(function (rw) {",
                  "                const nm = String((rw && rw.client) || '').trim().toLowerCase();",
                  "                const rs = String((rw && rw.goods) || '').trim().toLowerCase();",
                  "                if (_canonicalNauliCacheDedupe[nm] && rs.indexOf('nauli') > -1) {",
                  "                  if (_seenCanonicalNauliCache[nm]) return false;",
                  "                  _seenCanonicalNauliCache[nm] = 1;",
                  "                }",
                  "                return true;",
                  "              });",
              ])
              s = s[:m.end()] + extra + s[m.end():]

          # 3) Switching Quick Sale dates: dedupe stored rows too.
          if '_canonicalNauliStoreDedupe' not in s:
              s = s.replace(
                  "      const _cleanStoredExpenses = (Array.isArray(loaded.expenses) ? loaded.expenses : []).filter(function (rw) {",
                  "      let _cleanStoredExpenses = (Array.isArray(loaded.expenses) ? loaded.expenses : []).filter(function (rw) {",
                  1,
              )
              anchor = "      return { qsDateISO: newISO, qsStore: store, qsSales: loaded.sales, qsExpenses: _cleanStoredExpenses };"
              if anchor not in s:
                  raise SystemExit('stored date return anchor not found')
              block = "\n".join([
                  "      const _canonicalNauliStoreDedupe = " + canonical + ";",
                  "      const _seenCanonicalNauliStore = {};",
                  "      _cleanStoredExpenses = _cleanStoredExpenses.filter(function (rw) {",
                  "        const nm = String((rw && rw.client) || '').trim().toLowerCase();",
                  "        const rs = String((rw && rw.goods) || '').trim().toLowerCase();",
                  "        if (_canonicalNauliStoreDedupe[nm] && rs.indexOf('nauli') > -1) {",
                  "          if (_seenCanonicalNauliStore[nm]) return false;",
                  "          _seenCanonicalNauliStore[nm] = 1;",
                  "        }",
                  "        return true;",
                  "      });",
                  anchor,
              ])
              s = s.replace(anchor, block, 1)

          # 4) Fresh template rows get a stable per-day ExpenseID so repeated sessions do not create new worker rows.
          old_key = "    const key = (r._eid) || ('EXP-' + iso.replace(/-/g, '') + '-' + Date.now() + '-' + i);"
          if '_canonicalNauliStableId' not in s:
              if old_key not in s:
                  raise SystemExit('expense id anchor not found')
              new_key = "\n".join([
                  "    const _canonicalNauliStableId = " + canonical + ";",
                  "    const _isCanonicalNauli = !!(_canonicalNauliStableId[String(name || '').trim().toLowerCase()] && String(reason || '').trim().toLowerCase().indexOf('nauli') > -1);",
                  "    const _stableNauliSlug = String(name || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');",
                  "    const key = (r._eid) || (_isCanonicalNauli ? ('EXP-' + iso.replace(/-/g, '') + '-NAULI-' + _stableNauliSlug) : ('EXP-' + iso.replace(/-/g, '') + '-' + Date.now() + '-' + i));",
              ])
              s = s.replace(old_key, new_key, 1)

          required = ['_canonicalNauliCloudDedupe', '_canonicalNauliCacheDedupe', '_canonicalNauliStoreDedupe', '_canonicalNauliStableId']
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('validation failed: ' + ', '.join(missing))

          p.write_text(s, encoding='utf-8')
          print('Quick Sale worker dedupe applied at source')
          PY

      - name: Commit source fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix Quick Sale duplicate worker Nauli rows at source"
          git push
