name: Clean short Nauli names

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-nauli-short-names.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove legacy short names from Nauli template
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old="""  fpDailyExpTpl_ = () => {
    try { const t = JSON.parse(localStorage.getItem('fp_daily_exp_tpl') || 'null'); if (Array.isArray(t) && t.length) {
      const seen = {}, out = [];
      t.forEach(function (x) { if (!x || !x.name) return; const k = String(x.name).trim().toLowerCase(); if (!k || seen[k]) return; seen[k] = 1; out.push({ name: String(x.name).trim(), price: x.price }); });
      if (out.length) return out;
    } } catch (e) {}
    return [{ name: 'Stive', price: '5000' }, { name: 'Kwedy', price: '7000' }, { name: 'Sedekia', price: '7000' }, { name: 'Imma', price: '7000' }, { name: 'Hasan', price: '7000' }, { name: 'Ismo', price: '7000' }, { name: 'Suma', price: '7000' }, { name: 'Fadhil', price: '7000' }];
  };"""
          new="""  fpDailyExpTpl_ = () => {
    const legacy = { stive:1, kwedy:1, sedekia:1, imma:1, hasan:1, ismo:1, suma:1, fadhil:1, shaibu:1 };
    try { const t = JSON.parse(localStorage.getItem('fp_daily_exp_tpl') || 'null'); if (Array.isArray(t) && t.length) {
      const seen = {}, out = [];
      t.forEach(function (x) { if (!x || !x.name) return; const k = String(x.name).trim().toLowerCase(); if (!k || legacy[k] || seen[k]) return; seen[k] = 1; out.push({ name: String(x.name).trim(), price: x.price }); });
      if (out.length) { try { localStorage.setItem('fp_daily_exp_tpl', JSON.stringify(out)); } catch (e) {} return out; }
    } } catch (e) {}
    const full = [
      { name: 'Ismail Issa', price: '7000' },
      { name: 'Hassan Mwesiumo', price: '7000' },
      { name: 'Ismar Salim Hussein (Suma)', price: '7000' },
      { name: 'Steven Mkope', price: '5000' },
      { name: 'Fadhili Ally', price: '7000' },
      { name: 'Emanuel W. Sese (Ima)', price: '7000' },
      { name: 'Sedekia Johnson Laurent', price: '7000' },
      { name: 'Henry Charles Kwedi', price: '7000' },
      { name: 'Shaibu Frank Malekela', price: '7000' }
    ];
    try { localStorage.setItem('fp_daily_exp_tpl', JSON.stringify(full)); } catch (e) {}
    return full;
  };"""
          if old not in s:
              if "Hassan Mwesiumo" in s and "const legacy = { stive:1" in s:
                  print('daily template already patched')
              else:
                  raise SystemExit('fpDailyExpTpl_ anchor not found')
          else:
              s=s.replace(old,new,1)

          old2="""      try { (JSON.parse(localStorage.getItem('fp_daily_exp_tpl') || '[]') || []).forEach(function (x) { if (x && x.name) map[String(x.name).toLowerCase()] = { name: x.name, price: x.price }; }); } catch (e) {}
      (this.state.qsExpenses || []).forEach(function (r) { if (!r) return; const g = String(r.goods == null ? '' : r.goods).toLowerCase(); const nm = String(r.client == null ? '' : r.client).trim(); if (nm && g.indexOf('nauli') > -1) { map[nm.toLowerCase()] = { name: nm, price: String(r.price == null ? '' : r.price).replace(/[^0-9.]/g, '') }; } });"""
          new2="""      const legacy = { stive:1, kwedy:1, sedekia:1, imma:1, hasan:1, ismo:1, suma:1, fadhil:1, shaibu:1 };
      try { (JSON.parse(localStorage.getItem('fp_daily_exp_tpl') || '[]') || []).forEach(function (x) { if (x && x.name) { const k=String(x.name).trim().toLowerCase(); if (!legacy[k]) map[k] = { name: x.name, price: x.price }; } }); } catch (e) {}
      (this.state.qsExpenses || []).forEach(function (r) { if (!r) return; const g = String(r.goods == null ? '' : r.goods).toLowerCase(); const nm = String(r.client == null ? '' : r.client).trim(); const k = nm.toLowerCase(); if (nm && g.indexOf('nauli') > -1 && !legacy[k]) { map[k] = { name: nm, price: String(r.price == null ? '' : r.price).replace(/[^0-9.]/g, '') }; } });"""
          if old2 not in s:
              if "const legacy = { stive:1, kwedy:1, sedekia:1" in s and "fpSaveDailyExpTpl_" in s:
                  print('save template already patched')
              else:
                  raise SystemExit('fpSaveDailyExpTpl_ anchor not found')
          else:
              s=s.replace(old2,new2,1)

          p.write_text(s)
          print('Nauli short-name cleanup patched')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "remove short duplicate names from Nauli template"
          git push
