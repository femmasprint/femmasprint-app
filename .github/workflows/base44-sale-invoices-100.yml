name: "Base44 Sale Invoices exact copy"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/base44-sale-invoices-100.yml'
      - '.github/scripts/patch_base44_sale_invoices.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Sale Invoices from Base44 source layout
        run: python3 .github/scripts/patch_base44_sale_invoices.py
      - name: Validate JavaScript
        run: node --check fp-invoice-skin.js
      - name: Commit exact copy
        run: |
          if git diff --quiet -- fp-invoice-skin.js functions/_middleware.js; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fp-invoice-skin.js functions/_middleware.js
          git commit -m "copy Base44 Sale Invoices UI 1:1"
          git push
