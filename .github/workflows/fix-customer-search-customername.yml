name: Fix customer search for imported names

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-customer-search-customername.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch imported customer name mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "name: this.capWords(c.Name || c.name || ''),"
          new = "name: this.capWords(c.Name || c.CustomerName || c.name || c.customerName || ''),"
          if old not in s:
              if new in s:
                  print('already patched')
              else:
                  raise SystemExit('customer name mapping anchor not found')
          else:
              s = s.replace(old, new, 1)
              p.write_text(s)
              print('customer search name mapping patched')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix customer search for CustomerName imports"
          git push
