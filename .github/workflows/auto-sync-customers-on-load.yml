name: Auto sync customers on app load

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto-sync-customers-on-load.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch customer startup sync
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="try { const burl = localStorage.getItem('fp_backend_url'); if (burl) { this.setState({ backendUrl: burl, syncStatus: 'saved', backendConnected: /\\/exec$/.test(burl.trim()) }); setTimeout(() => this.loadTodaySales(), 400); this.startBotPolling(); this.startSyncPoll_(); this.loadAdminPhotoCloud_(); } } catch (e) {}"
          new="try { const burl = localStorage.getItem('fp_backend_url'); if (burl) { this.setState({ backendUrl: burl, syncStatus: 'saved', backendConnected: /\\/exec$/.test(burl.trim()) }, () => { setTimeout(() => this.loadTodaySales(), 400); setTimeout(() => this.pullCustomers(), 650); }); this.startBotPolling(); this.startSyncPoll_(); this.loadAdminPhotoCloud_(); } } catch (e) {}"
          if old not in s:
              if new in s:
                  print('already patched')
              else:
                  raise SystemExit('backend startup anchor not found')
          else:
              s=s.replace(old,new,1)
              p.write_text(s)
              print('customer startup sync patched')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "auto sync customer database on app load"
          git push
