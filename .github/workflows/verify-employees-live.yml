name: Verify Employees Live

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          echo "--- Employees endpoint ---"
          curl -sS --max-time 30 -w "\nhttp=%{http_code} total=%{time_total}s\n" "https://app.femmasprint.com/api/femmas-shared-sheet?sheet=Employees" -o /tmp/employees.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/employees.json'))
          rows=d.get('rows') or []
          print('ok',d.get('ok'),'source',d.get('source'),'rows',len(rows))
          print('first',[(r.get('EmployeeID'),r.get('EmployeeName')) for r in rows[:5]])
          if not d.get('ok') or len(rows) < 5:
              raise SystemExit(1)
          PY
          echo "--- Current production bundle ---"
          curl -sSL --max-time 30 "https://app.femmasprint.com/" -o /tmp/app.html
          grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' /tmp/app.html | head -1
          asset=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' /tmp/app.html | head -1)
          curl -sSL --max-time 30 "https://app.femmasprint.com$asset" -o /tmp/app.js
          python - <<'PY'
          from pathlib import Path
          c=Path('/tmp/app.js').read_text(errors='ignore')
          checks={
            'shared_endpoint':'/api/femmas-shared-sheet' in c,
            'employee_fallback':'sheet-employee-' in c,
            'parallel_staff_message':'Wafanyakazi hawakuweza kupakiwa kutoka Base44 wala FEMMAS database' in c,
            'session_cache':'femmas_shared_cache:' in c,
          }
          print(checks)
          if not all(checks.values()):
              raise SystemExit(1)
          PY
