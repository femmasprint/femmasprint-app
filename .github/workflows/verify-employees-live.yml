name: Verify Employees Live

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set -u
          BRIDGE="https://script.google.com/macros/s/AKfycbzgr7hqI4vPFHB9nNRh2l7Ljb7m0KCf9Yl1Ue4pEfgSAADE4-luyv0B3_tn0zo0bQzecg/exec"

          echo "--- Direct Apps Script getTable Employees ---"
          curl -sSL --max-time 35 -w "\nhttp=%{http_code} total=%{time_total}s\n" "$BRIDGE?action=getTable&tab=Employees&callback=probeCb" -o /tmp/direct.txt || true
          echo "bytes=$(wc -c < /tmp/direct.txt)"
          head -c 1500 /tmp/direct.txt | tr '\n' ' '
          echo

          echo "--- Direct candidate getEmployees ---"
          curl -sSL --max-time 35 -w "\nhttp=%{http_code} total=%{time_total}s\n" "$BRIDGE?action=getEmployees&callback=probeCb" -o /tmp/employees-action.txt || true
          echo "bytes=$(wc -c < /tmp/employees-action.txt)"
          head -c 1500 /tmp/employees-action.txt | tr '\n' ' '
          echo

          echo "--- Production Employees endpoint ---"
          curl -sS --max-time 35 -w "\nhttp=%{http_code} total=%{time_total}s\n" "https://app.femmasprint.com/api/femmas-shared-sheet?sheet=Employees" -o /tmp/prod.json || true
          echo "bytes=$(wc -c < /tmp/prod.json)"
          cat /tmp/prod.json
          echo

          echo "--- Current production bundle ---"
          curl -sSL --max-time 30 "https://app.femmasprint.com/" -o /tmp/app.html || true
          grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' /tmp/app.html | head -1 || true
