name: Rollback customer autosync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rollback-customer-autosync.yml'

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove startup customer autosync
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          bad="try { const burl = localStorage.getItem('fp_backend_url'); if (burl) { this.setState({ backendUrl: burl, syncStatus: 'saved', backendConnected: /\\/exec$/.test(burl.trim()) }, () => { setTimeout(() => this.loadTodaySales(), 400); setTimeout(() => this.pullCustomers(), 650); }); this.startBotPolling(); this.startSyncPoll_(); this.loadAdminPhotoCloud_(); } } catch (e) {}"
          good="try { const burl = localStorage.getItem('fp_backend_url'); if (burl) { this.setState({ backendUrl: burl, syncStatus: 'saved', backendConnected: /\\/exec$/.test(burl.trim()) }); setTimeout(() => this.loadTodaySales(), 400); this.startBotPolling(); this.startSyncPoll_(); this.loadAdminPhotoCloud_(); } } catch (e) {}"
          if bad not in s:
              if good in s:
                  print('autosync already removed')
              else:
                  raise SystemExit('startup autosync line not found')
          else:
              s=s.replace(bad,good,1)
              p.write_text(s)
              print('startup customer autosync removed')
          PY
      - name: Commit rollback
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "rollback startup customer autosync"
          git push
