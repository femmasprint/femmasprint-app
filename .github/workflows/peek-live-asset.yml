name: Peek Live Asset
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set -e
          curl -sSL --max-time 30 https://app.femmasprint.com/ -o /tmp/app.html
          asset=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' /tmp/app.html | head -1)
          echo "asset=$asset"
          curl -sS --max-time 30 -w " employees_http=%{http_code} employees_time=%{time_total}s\n" "https://app.femmasprint.com/api/femmas-shared-sheet?sheet=Employees" -o /tmp/e.json
          python -c "import json; d=json.load(open('/tmp/e.json')); print('employees_rows',len(d.get('rows') or []),'source',d.get('source'))"
