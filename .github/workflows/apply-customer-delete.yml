name: Apply customer delete patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-customer-delete.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Customers delete action
        run: python .github/scripts/add_customer_delete.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git add index.html
          git commit -m "add customer delete to recycle bin"
          git push
