name: Apply invoice save edit patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-invoice-vyapar-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python .github/scripts/fix_invoice_vyapar.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix invoice save and edit flow" || exit 0
          git push
