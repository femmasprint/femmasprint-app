name: Fix invoice sequence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-invoice-sequence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch invoice sequence generation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const seq = (this.state.savedDocs || []).filter(d => d.typeKey === typeKey).length + 1;"
          new="const seq = typeKey === 'sale' ? (Math.max(0, ...(this.state.savedInvoices || []).map(r => { const m = String(r.InvoiceNo || '').match(/(\\d+)$/); return m ? parseInt(m[1], 10) : 0; }), ...(this.state.savedDocs || []).filter(d => d.typeKey === 'sale').map(d => { const m = String(d.no || '').match(/(\\d+)$/); return m ? parseInt(m[1], 10) : 0; })) + 1) : ((this.state.savedDocs || []).filter(d => d.typeKey === typeKey).length + 1);"
          if old not in s:
              raise SystemExit('saveSale sequence anchor not found')
          s=s.replace(old,new,1)
          old2="const nextInvSeq = Math.max(...inv.map(r => parseInt(r[1], 10))) + 1;"
          new2="const nextInvSeq = Math.max(0, ...inv.map(r => parseInt(r[1], 10) || 0), ...(this.state.savedInvoices || []).map(r => { const m = String(r.InvoiceNo || '').match(/(\\d+)$/); return m ? parseInt(m[1], 10) : 0; }), ...(this.state.savedDocs || []).filter(d => d.typeKey === 'sale').map(d => { const m = String(d.no || '').match(/(\\d+)$/); return m ? parseInt(m[1], 10) : 0; })) + 1;"
          if old2 not in s:
              raise SystemExit('render invoice sequence anchor not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          print('invoice sequence patched')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix invoice numbering for synced invoices"
          git push
